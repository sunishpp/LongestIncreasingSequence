name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore LongestIncreasingSubsequence.sln

      - name: Build with warnings as errors
        run: dotnet build LongestIncreasingSubsequence.sln --configuration Release --no-restore --warnaserror

      - name: Run lint checks
        shell: pwsh
        run: ./scripts/lint.ps1

      - name: Run tests with coverage
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/coverage"
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          dotnet test "$GITHUB_WORKSPACE/tests/LongestIncreasingSubsequence.Tests/LongestIncreasingSubsequence.Tests.csproj" \
            --configuration Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory "$GITHUB_WORKSPACE/coverage" \
            --logger "trx;LogFileName=test-results.trx"

      - name: Inspect coverage output
        if: always()
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/coverage" -maxdepth 3 -type f -print
          test -n "$(find "$GITHUB_WORKSPACE/coverage" -name coverage.cobertura.xml -print -quit)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ github.workspace }}/coverage
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/coverage/**/*.trx
            ${{ github.workspace }}/coverage/**/*.xml
          if-no-files-found: warn
